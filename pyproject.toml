[project]
name = "qa-agent"
version = "1.1.1"
description = "基于 RAG 的私人知识库问答助手（LangChain + ChromaDB + Streamlit）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "dashscope>=1.25.24",
    "langchain>=1.3.10",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.8",
    "langchain-deepseek>=1.1.0",
    "langchain-tavily>=0.2.18",
    "langchain-unstructured>=1.0.1",
    "pyarrow==23.0.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
    "unstructured-inference>=1.6.13",
    "unstructured[docx,md,pdf]>=0.23.1",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
